name: Deploy Site

on:
  push:
    branches: ["main"]

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: production
  cancel-in-progress: true

jobs:
  deployment:
    runs-on: ubuntu-latest
    environment:
      name: production
      deployment: true
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Installing minifier
        run: sudo apt-get install minify
      - name: Minifying files
        run: minify -r ./ -s -o ./dist --html-keep-document-tags --html-keep-end-tags --html-keep-default-attrvals
      - name: Installing SSH key
        uses: shimataro/ssh-key-action@v2
        with:
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          known_hosts: "ignorethislmao"
      - name: Adding known hosts
        run: ssh-keyscan -H ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts
      - name: Replace cache query parameter
        run: |
          ts=$(date +%s)
          find . -name "*.html" -type f -exec sed -i "s/\?timestamp/\?$ts/g" {} +
      - name: Deploying with rsync
        run: rsync -avz ./dist/ ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/var/www/FLB
      - name: Purging cache
        uses: jakejarvis/cloudflare-purge-action@master
        env:
          CLOUDFLARE_ZONE: ${{ secrets.CLOUDFLARE_ZONE }}
          CLOUDFLARE_TOKEN: ${{ secrets.CLOUDFLARE_TOKEN }}
